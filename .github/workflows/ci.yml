name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  boru-hatti:
    name: lint → tip → test → build → e2e → lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Biçim kontrolü
        run: npm run format:check

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim testleri
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sinaptiklab.com

      - name: Index kurulumu (MONGODB_URI secret'ı varsa)
        run: npm run db:indexes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: sinaptiklab

      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium

      - name: E2E + erişilebilirlik (axe)
        run: npm run test:e2e

      - name: Lighthouse CI (bütçeler BRIEF §9.1)
        run: npx --yes @lhci/cli@0.15.x autorun

      - name: Playwright raporu (hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
